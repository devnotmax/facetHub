services:
  postgres:
    image: postgres:18.7-alpine
    container_name: facet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facet_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: La variable POSTGRES_PASSWORD es obligatoria}"
      POSTGRES_DB: ${POSTGRES_DB:-facet_db}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-facet_user} -d $${POSTGRES_DB:-facet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - facet_network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: facet_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgres://${POSTGRES_USER:-facet_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-facet_db}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - facet_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: facet_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - facet_network

volumes:
  postgres_data:

networks:
  facet_network:
    driver: bridge
